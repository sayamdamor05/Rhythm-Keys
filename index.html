<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rhythm Keys // 3D Cosmic Rhythm-Typing</title>
  <!-- Google Fonts: Inter, Fira Code, Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <!-- Three.js CDN for standalone compatibility -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <!-- ================= 1. THREE.JS 3D CANVAS BACKGROUND ================= -->
  <canvas id="spaceCanvas" class="three-space-canvas"></canvas>

  <!-- ================= 2. SPACESHIPI COCKPIT FRAME OVERLAY ================= -->
  <div class="cockpit-viewport-frame" aria-hidden="true">
    <!-- Top Cockpit Canopy Visor -->
    <div class="cockpit-canopy-top">
      <div class="canopy-pill-group">
        <span class="hud-pill pill-cyan"></span>
        <span class="hud-pill pill-pink"></span>
        <span class="hud-pill pill-cyan"></span>
        <span class="hud-pill pill-pink"></span>
      </div>
    </div>

    <!-- Left & Right Sleek Cockpit Window Struts with Neon Accents -->
    <div class="cockpit-strut strut-left">
      <div class="neon-line-cyan"></div>
    </div>
    <div class="cockpit-strut strut-right">
      <div class="neon-line-cyan"></div>
    </div>

    <!-- Bottom Dashboard Console -->
    <div class="cockpit-dashboard-bottom"></div>
  </div>

  <!-- ================= 3. FOREGROUND GLASSMORPHIC UI ================= -->
  <div class="app-ui-container" id="app">
    <!-- TOP HEADER -->
    <header class="ui-header glass-panel">
      <!-- Left: Brand Logo -->
      <div class="header-left">
        <span class="brand-title">Rhythm Keys</span>
      </div>

      <!-- Center: Track Info -->
      <div class="header-center">
        <div class="track-header-block">
          <span class="track-title-text" id="currentTrackTitle">Midnight City</span>
          <span class="track-artist-text" id="currentTrackArtist">M83</span>
        </div>
      </div>

      <!-- Right: Navigation, Stats & Settings -->
      <div class="header-right">
        <nav class="header-nav" aria-label="Game Modes">
          <button class="nav-btn" id="navPractice">Practice</button>
          <button class="nav-btn active" id="navPlay">Play</button>
          <button class="nav-btn" id="navLeaderboard">Leaderboard</button>
        </nav>

        <div class="nav-divider"></div>

        <div class="header-stats-group">
          <div class="stat-unit">
            <span class="stat-unit-label">WPM</span>
            <span class="stat-unit-val cyan-val" id="hudWpm">74</span>
          </div>
          <div class="stat-unit">
            <span class="stat-unit-label">ACC</span>
            <span class="stat-unit-val pink-val" id="hudAcc">98%</span>
          </div>
        </div>

        <button class="settings-btn" id="btnSettings" title="Track & Audio Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- CENTER STAGE (Lyrics Display & Pastel Soft 3D Keyboard) -->
    <main class="center-stage">
      <!-- Lyrics Container -->
      <section class="lyrics-panel glass-panel" id="lyricsContainer" aria-live="polite">
        <div class="lyric-stream">
          <!-- Line 1: Previous (Muted Lavender Grey) -->
          <div class="lyric-line lyric-prev" id="lyricPrev">
            <span class="line-text" id="lyricPrevText">Waiting for the sun to rise</span>
          </div>

          <!-- Line 2: Active Target Line (Cyan Typed, Red Error Box, Clean Untyped) -->
          <div class="lyric-line lyric-active" id="lyricActive">
            <div class="active-chars-container" id="activeChars">
              <span class="char char-correct">The city is </span>
              <span class="char char-error">m</span>
              <span class="char char-pending">y playground</span>
            </div>
          </div>

          <!-- Line 3: Upcoming (Muted Lavender Grey) -->
          <div class="lyric-line lyric-next" id="lyricNext">
            <span class="line-text" id="lyricNextText">Neon lights are shining bright</span>
          </div>
        </div>
      </section>

      <!-- Keyboard Container -->
      <section class="keyboard-panel glass-panel" id="virtualKeyboard" aria-label="Virtual Keyboard">
        <!-- Row 1: Q W E R T Y U I O P -->
        <div class="kb-row kb-row-1">
          <button class="key key-3d key-cyan" data-key="q">Q</button>
          <button class="key key-3d key-pink" data-key="w">W</button>
          <button class="key key-3d key-purple" data-key="e">E</button>
          <button class="key key-3d key-yellow" data-key="r">R</button>
          <button class="key key-3d key-mint" data-key="t">T</button>
          <button class="key key-3d key-cyan" data-key="y">Y</button>
          <button class="key key-3d key-pink" data-key="u">U</button>
          <button class="key key-3d key-purple" data-key="i">I</button>
          <button class="key key-3d key-yellow" data-key="o">O</button>
          <button class="key key-3d key-mint" data-key="p">P</button>
        </div>

        <!-- Row 2: A S D F G H J K L -->
        <div class="kb-row kb-row-2">
          <button class="key key-3d key-yellow" data-key="a">A</button>
          <button class="key key-3d key-mint" data-key="s">S</button>
          <button class="key key-3d key-cyan" data-key="d">D</button>
          <button class="key key-3d key-pink" data-key="f">F</button>
          <button class="key key-3d key-purple" data-key="g">G</button>
          <button class="key key-3d key-yellow" data-key="h">H</button>
          <button class="key key-3d key-mint" data-key="j">J</button>
          <button class="key key-3d key-cyan" data-key="k">K</button>
          <button class="key key-3d key-pink" data-key="l">L</button>
        </div>

        <!-- Row 3: Z X C V B N M -->
        <div class="kb-row kb-row-3">
          <button class="key key-3d key-purple" data-key="z">Z</button>
          <button class="key key-3d key-yellow" data-key="x">X</button>
          <button class="key key-3d key-mint" data-key="c">C</button>
          <button class="key key-3d key-cyan" data-key="v">V</button>
          <button class="key key-3d key-pink" data-key="b">B</button>
          <button class="key key-3d key-purple" data-key="n">N</button>
          <button class="key key-3d key-yellow" data-key="m">M</button>
        </div>

        <!-- Row 4: Left Modifier, SPACEBAR, Right Modifier -->
        <div class="kb-row kb-row-4">
          <button class="key key-3d key-mod key-mint" data-key="Shift" aria-label="Shift"></button>
          <button class="key key-3d key-space" data-key=" ">SPACE</button>
          <button class="key key-3d key-mod key-pink" data-key="Backspace" aria-label="Backspace"></button>
        </div>
      </section>
    </main>

    <!-- BOTTOM FOOTER -->
    <footer class="ui-footer glass-panel">
      <!-- Left: Restart -->
      <div class="footer-left">
        <button class="footer-btn" id="btnRestart" title="Restart Song">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
          <span>RESTART</span>
        </button>
      </div>

      <!-- Center: Play/Pause Circular Pink Button -->
      <div class="footer-center">
        <button class="play-btn-circle" id="btnPlayPause" aria-label="Play or Pause">
          <div class="play-icon-inner">
            <span class="pause-bar" id="pauseBar1"></span>
            <span class="pause-bar" id="pauseBar2"></span>
          </div>
          <span class="play-btn-label" id="playButtonText">PAUSE</span>
        </button>
      </div>

      <!-- Right: Difficulty Toggle -->
      <div class="footer-right">
        <button class="footer-btn" id="diffHard" title="Difficulty">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M4 15h16M4 9h16M8 3v18M16 3v18"/>
          </svg>
          <span id="diffText">HARD</span>
        </button>
      </div>
    </footer>
  </div>

  <!-- ================= SETTINGS & TRACK MODAL ================= -->
  <div class="modal-overlay" id="settingsModal" aria-hidden="true">
    <div class="modal-card glass-panel">
      <div class="modal-header">
        <h2 class="modal-title">Track & Audio Controls</h2>
        <button class="modal-close-btn" id="btnSettingsClose">&times;</button>
      </div>
      <div class="modal-body">
        <label class="modal-label" for="trackSelector">Song Selection</label>
        <select id="trackSelector" class="modal-select">
          <option value="midnight-city">Midnight City - M83</option>
          <option value="cyber-odyssey">Cyber Odyssey - Stellar Voyager</option>
          <option value="neon-pulse">Neon Pulse - RetroWave 2088</option>
          <option value="custom-lrc">Custom LRC & Audio URL...</option>
        </select>

        <label class="modal-label" for="volumeSlider">Volume</label>
        <input type="range" id="volumeSlider" class="modal-slider" min="0" max="100" value="85" />

        <div class="custom-fields" id="customFields" style="display: none;">
          <label class="modal-label" for="customTitleInput">Song Title & Artist</label>
          <input type="text" id="customTitleInput" class="modal-input" placeholder="e.g. Midnight City - M83" />

          <label class="modal-label" for="customAudioUrl">Audio URL (Optional MP3)</label>
          <input type="url" id="customAudioUrl" class="modal-input" placeholder="https://...mp3 (Leave empty for procedural synth)" />

          <label class="modal-label" for="customLrcText">Paste .LRC Lyrics</label>
          <textarea id="customLrcText" class="modal-textarea" rows="5" placeholder="[00:00.00] First lyric line..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btnSettingsCancel">Close</button>
        <button class="btn btn-primary" id="btnSettingsApply">Apply Track</button>
      </div>
    </div>
  </div>

  <!-- ================= RESULTS MODAL ================= -->
  <div class="modal-overlay" id="resultsModal" aria-hidden="true">
    <div class="modal-card glass-panel results-card">
      <div class="results-badge" id="resultsGradeBadge">RANK S</div>
      <h2 class="results-title">Song Complete</h2>
      <p class="results-subtitle" id="resultsTrackInfo">Midnight City // M83</p>

      <div class="results-grid">
        <div class="result-box">
          <span class="res-label">SPEED</span>
          <span class="res-val cyan-val" id="resWpm">74 WPM</span>
        </div>
        <div class="result-box">
          <span class="res-label">ACCURACY</span>
          <span class="res-val pink-val" id="resAcc">98%</span>
        </div>
        <div class="result-box">
          <span class="res-label">MAX COMBO</span>
          <span class="res-val yellow-val" id="resCombo">x4</span>
        </div>
        <div class="result-box">
          <span class="res-label">COMPLETED LINES</span>
          <span class="res-val mint-val" id="resLines">10 / 10</span>
        </div>
      </div>

      <div class="modal-footer results-footer">
        <button class="btn btn-primary" id="btnResultsRestart">Play Again</button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
