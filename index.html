<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rhythm Keys // Whimsical Cosmic Rhythm-Typing</title>
  <!-- Google Fonts: Inter, Fira Code, Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <!-- ================= LAYER 1: DEEP SPACE BACKGROUND & CELESTIAL BODIES ================= -->
  <div class="space-viewport" id="spaceViewport">
    <!-- Cosmic Nebula Gradient Layers -->
    <div class="cosmic-nebula nebula-1"></div>
    <div class="cosmic-nebula nebula-2"></div>

    <!-- Outward Forward-Momentum Starfield Particles -->
    <div class="starfield-burst burst-1"></div>
    <div class="starfield-burst burst-2"></div>
    <div class="starfield-burst burst-3"></div>

    <!-- 6 Whimsical 2D Celestial Bodies Drifting Outward from Center (SVG/CSS) -->

    <!-- 1. The Iconic Yellow Saturn with Pink Ring (Drifts Upper-Left) -->
    <div class="celestial-body saturn-yellow body-drift-1" aria-hidden="true">
      <svg class="planet-svg" viewBox="0 0 200 200" width="100%" height="100%">
        <defs>
          <radialGradient id="saturnGrad" cx="40%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#fff59d"/>
            <stop offset="35%" stop-color="#ffd54f"/>
            <stop offset="70%" stop-color="#ffb300"/>
            <stop offset="100%" stop-color="#f57c00"/>
          </radialGradient>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff4081"/>
            <stop offset="50%" stop-color="#f50057"/>
            <stop offset="100%" stop-color="#c51162"/>
          </linearGradient>
        </defs>
        <!-- Back Ring -->
        <ellipse cx="100" cy="100" rx="92" ry="24" fill="none" stroke="url(#ringGrad)" stroke-width="14" transform="rotate(-28 100 100)" stroke-dasharray="280 280" stroke-dashoffset="140"/>
        <!-- Planet Sphere -->
        <circle cx="100" cy="100" r="54" fill="url(#saturnGrad)"/>
        <!-- Planet Surface Stripes -->
        <path d="M52 92 Q100 112 148 92" stroke="#ffa000" stroke-width="5" fill="none" opacity="0.6"/>
        <path d="M56 108 Q100 128 144 108" stroke="#ff8f00" stroke-width="4" fill="none" opacity="0.6"/>
        <!-- Front Ring -->
        <ellipse cx="100" cy="100" rx="92" ry="24" fill="none" stroke="url(#ringGrad)" stroke-width="14" transform="rotate(-28 100 100)" stroke-dasharray="280 280" stroke-dashoffset="0"/>
        <!-- Ring Sparkle Dots -->
        <circle cx="28" cy="135" r="3" fill="#fff" opacity="0.9"/>
        <circle cx="172" cy="65" r="3" fill="#fff" opacity="0.9"/>
      </svg>
    </div>

    <!-- 2. The Whimsical Retro Rocket Ship (Drifts Upper-Right) -->
    <div class="celestial-body retro-rocket body-drift-2" aria-hidden="true">
      <svg class="planet-svg" viewBox="0 0 160 160" width="100%" height="100%">
        <defs>
          <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffeb3b"/>
            <stop offset="60%" stop-color="#ffc107"/>
            <stop offset="100%" stop-color="#ff9800"/>
          </linearGradient>
          <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ff1744"/>
            <stop offset="60%" stop-color="#ff9100"/>
            <stop offset="100%" stop-color="#ffff00"/>
          </linearGradient>
        </defs>
        <!-- Rocket Exhaust Flames -->
        <polygon points="42,118 10,135 32,108 5,120 38,98" fill="url(#flameGrad)"/>
        <!-- Fins -->
        <path d="M48 65 L25 88 L52 96 Z" fill="#ff5722"/>
        <path d="M78 102 L95 125 L65 118 Z" fill="#ff5722"/>
        <!-- Rocket Fuselage -->
        <ellipse cx="85" cy="75" rx="42" ry="26" fill="url(#rocketBody)" transform="rotate(-38 85 75)"/>
        <!-- Nosecone -->
        <path d="M106 48 Q128 32 120 54 Z" fill="#e91e63"/>
        <!-- Porthole Window -->
        <circle cx="85" cy="72" r="10" fill="#00e5ff" stroke="#fff" stroke-width="2.5"/>
        <circle cx="82" cy="69" r="3" fill="#fff"/>
      </svg>
    </div>

    <!-- 3. Blue Swirl Oceanic Exoplanet (Drifts Lower-Right) -->
    <div class="celestial-body blue-exoplanet body-drift-3" aria-hidden="true">
      <svg class="planet-svg" viewBox="0 0 140 140" width="100%" height="100%">
        <defs>
          <radialGradient id="bluePlanetGrad" cx="35%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#80d8ff"/>
            <stop offset="40%" stop-color="#00b0ff"/>
            <stop offset="80%" stop-color="#00468c"/>
            <stop offset="100%" stop-color="#011b40"/>
          </radialGradient>
        </defs>
        <circle cx="70" cy="70" r="52" fill="url(#bluePlanetGrad)"/>
        <!-- Atmospheric Swirls -->
        <path d="M28 62 Q70 85 112 62" stroke="rgba(255,255,255,0.4)" stroke-width="6" fill="none" stroke-linecap="round"/>
        <path d="M35 78 Q70 100 105 78" stroke="rgba(128,216,255,0.6)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
        <circle cx="50" cy="45" r="5" fill="#fff" opacity="0.6"/>
      </svg>
    </div>

    <!-- 4. Textured Pink/Magenta Planet (Drifts Lower-Left) -->
    <div class="celestial-body pink-stippled-planet body-drift-4" aria-hidden="true">
      <svg class="planet-svg" viewBox="0 0 140 140" width="100%" height="100%">
        <defs>
          <radialGradient id="pinkPlanetGrad" cx="40%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#ff80ab"/>
            <stop offset="45%" stop-color="#f50057"/>
            <stop offset="85%" stop-color="#880e4f"/>
            <stop offset="100%" stop-color="#4a0025"/>
          </radialGradient>
        </defs>
        <circle cx="70" cy="70" r="48" fill="url(#pinkPlanetGrad)"/>
        <!-- Stylized Craters & Stipples -->
        <circle cx="52" cy="55" r="8" fill="#c51162" opacity="0.8"/>
        <circle cx="50" cy="53" r="7" fill="#f50057"/>
        <circle cx="85" cy="78" r="11" fill="#880e4f" opacity="0.8"/>
        <circle cx="83" cy="76" r="9.5" fill="#c51162"/>
        <circle cx="72" cy="45" r="4" fill="#ff4081"/>
        <circle cx="45" cy="85" r="5" fill="#ff4081"/>
      </svg>
    </div>

    <!-- 5. Turquoise Glowing Exoplanet with Moon (Drifts Mid-Left) -->
    <div class="celestial-body turquoise-planet body-drift-5" aria-hidden="true">
      <svg class="planet-svg" viewBox="0 0 120 120" width="100%" height="100%">
        <defs>
          <radialGradient id="turqGrad" cx="35%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#a7ffeb"/>
            <stop offset="40%" stop-color="#1de9b6"/>
            <stop offset="85%" stop-color="#00695c"/>
            <stop offset="100%" stop-color="#00332c"/>
          </radialGradient>
        </defs>
        <circle cx="60" cy="60" r="38" fill="url(#turqGrad)"/>
        <!-- Tiny Orbiting Coral Moon -->
        <circle cx="102" cy="35" r="9" fill="#ff6e40" stroke="#ffe57f" stroke-width="1.5"/>
      </svg>
    </div>

    <!-- 6. Golden Shooting Stars with Comet Streamers (Drifts Center-Right) -->
    <div class="celestial-body golden-comet body-drift-6" aria-hidden="true">
      <svg class="planet-svg" viewBox="0 0 180 180" width="100%" height="100%">
        <defs>
          <linearGradient id="cometTail" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="rgba(255,235,59,0)"/>
            <stop offset="70%" stop-color="rgba(255,213,79,0.7)"/>
            <stop offset="100%" stop-color="#fff"/>
          </linearGradient>
        </defs>
        <!-- Dual Tail Trails -->
        <path d="M30 30 Q80 80 135 135" stroke="url(#cometTail)" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M50 20 Q95 65 145 115" stroke="url(#cometTail)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <!-- Star Head -->
        <polygon points="140,140 144,128 152,140 164,144 152,148 144,160 140,148 128,144" fill="#fffde7" stroke="#ffd600" stroke-width="1.5"/>
        <circle cx="144" cy="144" r="5" fill="#fff"/>
      </svg>
    </div>
  </div>

  <!-- ================= LAYER 2: SPACESHIPI COCKPIT FRAME ================= -->
  <div class="cockpit-viewport-frame" aria-hidden="true">
    <!-- Top Cockpit Canopy Visor -->
    <div class="cockpit-canopy-top">
      <div class="canopy-pill-group">
        <span class="hud-pill pill-cyan"></span>
        <span class="hud-pill pill-pink"></span>
        <span class="hud-pill pill-cyan"></span>
        <span class="hud-pill pill-pink"></span>
      </div>
    </div>

    <!-- Left & Right Sleek Cockpit Window Struts with Neon Accents -->
    <div class="cockpit-strut strut-left">
      <div class="neon-line-cyan"></div>
    </div>
    <div class="cockpit-strut strut-right">
      <div class="neon-line-cyan"></div>
    </div>

    <!-- Bottom Dashboard Console -->
    <div class="cockpit-dashboard-bottom">
      <div class="neon-line-bottom"></div>
    </div>
  </div>

  <!-- ================= LAYER 3: THE INTERACTIVE UI (FOREGROUND) ================= -->
  <div class="app-ui-container" id="app">
    <!-- 1. TOP HEADER -->
    <header class="ui-header glass-panel">
      <!-- Left: Logo -->
      <div class="header-left">
        <span class="brand-title">Rhythm Keys</span>
      </div>

      <!-- Center: Track Info -->
      <div class="header-center">
        <div class="track-header-block">
          <span class="track-title-text" id="currentTrackTitle">Midnight City</span>
          <span class="track-artist-text" id="currentTrackArtist">M83</span>
        </div>
      </div>

      <!-- Right: Navigation, Stats & Settings -->
      <div class="header-right">
        <nav class="header-nav" aria-label="Game Modes">
          <button class="nav-btn" id="navPractice">Practice</button>
          <button class="nav-btn active" id="navPlay">Play</button>
          <button class="nav-btn" id="navLeaderboard">Leaderboard</button>
        </nav>

        <div class="nav-divider"></div>

        <div class="header-stats-group">
          <div class="stat-unit">
            <span class="stat-unit-label">WPM</span>
            <span class="stat-unit-val cyan-val" id="hudWpm">74</span>
          </div>
          <div class="stat-unit">
            <span class="stat-unit-label">ACC</span>
            <span class="stat-unit-val pink-val" id="hudAcc">98%</span>
          </div>
        </div>

        <button class="settings-btn" id="btnSettings" title="Track & Audio Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 2. CENTER STAGE (Lyrics Display & Pastel Soft 3D Keyboard) -->
    <main class="center-stage">
      <!-- Lyrics Container -->
      <section class="lyrics-panel glass-panel" id="lyricsContainer" aria-live="polite">
        <div class="lyric-stream">
          <!-- Line 1: Previous (Muted Lavender Grey) -->
          <div class="lyric-line lyric-prev" id="lyricPrev">
            <span class="line-text" id="lyricPrevText">Waiting for the sun to rise</span>
          </div>

          <!-- Line 2: Active Target Line (Cyan Typed, Red Error Box, Clean Untyped) -->
          <div class="lyric-line lyric-active" id="lyricActive">
            <div class="active-chars-container" id="activeChars">
              <span class="char char-correct">The city is </span>
              <span class="char char-error">m</span>
              <span class="char char-pending">y playground</span>
            </div>
          </div>

          <!-- Line 3: Upcoming (Muted Lavender Grey) -->
          <div class="lyric-line lyric-next" id="lyricNext">
            <span class="line-text" id="lyricNextText">Neon lights are shining bright</span>
          </div>
        </div>
      </section>

      <!-- Keyboard Container -->
      <section class="keyboard-panel glass-panel" id="virtualKeyboard" aria-label="Virtual Keyboard">
        <!-- Row 1: Q W E R T Y U I O P -->
        <div class="kb-row kb-row-1">
          <button class="key key-3d key-cyan" data-key="q">Q</button>
          <button class="key key-3d key-pink" data-key="w">W</button>
          <button class="key key-3d key-purple" data-key="e">E</button>
          <button class="key key-3d key-yellow" data-key="r">R</button>
          <button class="key key-3d key-mint" data-key="t">T</button>
          <button class="key key-3d key-cyan" data-key="y">Y</button>
          <button class="key key-3d key-pink" data-key="u">U</button>
          <button class="key key-3d key-purple" data-key="i">I</button>
          <button class="key key-3d key-yellow" data-key="o">O</button>
          <button class="key key-3d key-mint" data-key="p">P</button>
        </div>

        <!-- Row 2: A S D F G H J K L -->
        <div class="kb-row kb-row-2">
          <button class="key key-3d key-yellow" data-key="a">A</button>
          <button class="key key-3d key-mint" data-key="s">S</button>
          <button class="key key-3d key-cyan" data-key="d">D</button>
          <button class="key key-3d key-pink" data-key="f">F</button>
          <button class="key key-3d key-purple" data-key="g">G</button>
          <button class="key key-3d key-yellow" data-key="h">H</button>
          <button class="key key-3d key-mint" data-key="j">J</button>
          <button class="key key-3d key-cyan" data-key="k">K</button>
          <button class="key key-3d key-pink" data-key="l">L</button>
        </div>

        <!-- Row 3: Z X C V B N M -->
        <div class="kb-row kb-row-3">
          <button class="key key-3d key-purple" data-key="z">Z</button>
          <button class="key key-3d key-yellow" data-key="x">X</button>
          <button class="key key-3d key-mint" data-key="c">C</button>
          <button class="key key-3d key-cyan" data-key="v">V</button>
          <button class="key key-3d key-pink" data-key="b">B</button>
          <button class="key key-3d key-purple" data-key="n">N</button>
          <button class="key key-3d key-yellow" data-key="m">M</button>
        </div>

        <!-- Row 4: Left Modifier, SPACEBAR, Right Modifier -->
        <div class="kb-row kb-row-4">
          <button class="key key-3d key-mod key-mint" data-key="Shift" aria-label="Shift"></button>
          <button class="key key-3d key-space" data-key=" ">SPACE</button>
          <button class="key key-3d key-mod key-pink" data-key="Backspace" aria-label="Backspace"></button>
        </div>
      </section>
    </main>

    <!-- 3. BOTTOM FOOTER -->
    <footer class="ui-footer glass-panel">
      <!-- Left: Restart -->
      <div class="footer-left">
        <button class="footer-btn" id="btnRestart" title="Restart Song">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
          <span>RESTART</span>
        </button>
      </div>

      <!-- Center: Play/Pause Circular Pink Button -->
      <div class="footer-center">
        <button class="play-btn-circle" id="btnPlayPause" aria-label="Play or Pause">
          <div class="play-icon-inner">
            <span class="pause-bar" id="pauseBar1"></span>
            <span class="pause-bar" id="pauseBar2"></span>
          </div>
          <span class="play-btn-label" id="playButtonText">PAUSE</span>
        </button>
      </div>

      <!-- Right: Difficulty Toggle -->
      <div class="footer-right">
        <button class="footer-btn" id="diffHard" title="Difficulty">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M4 15h16M4 9h16M8 3v18M16 3v18"/>
          </svg>
          <span id="diffText">HARD</span>
        </button>
      </div>
    </footer>
  </div>

  <!-- ================= SETTINGS & TRACK MODAL ================= -->
  <div class="modal-overlay" id="settingsModal" aria-hidden="true">
    <div class="modal-card glass-panel">
      <div class="modal-header">
        <h2 class="modal-title">Track & Audio Controls</h2>
        <button class="modal-close-btn" id="btnSettingsClose">&times;</button>
      </div>
      <div class="modal-body">
        <label class="modal-label" for="trackSelector">Song Selection</label>
        <select id="trackSelector" class="modal-select">
          <option value="midnight-city">Midnight City - M83</option>
          <option value="cyber-odyssey">Cyber Odyssey - Stellar Voyager</option>
          <option value="neon-pulse">Neon Pulse - RetroWave 2088</option>
          <option value="custom-lrc">Custom LRC & Audio URL...</option>
        </select>

        <label class="modal-label" for="volumeSlider">Volume</label>
        <input type="range" id="volumeSlider" class="modal-slider" min="0" max="100" value="85" />

        <div class="custom-fields" id="customFields" style="display: none;">
          <label class="modal-label" for="customTitleInput">Song Title & Artist</label>
          <input type="text" id="customTitleInput" class="modal-input" placeholder="e.g. Midnight City - M83" />

          <label class="modal-label" for="customAudioUrl">Audio URL (Optional MP3)</label>
          <input type="url" id="customAudioUrl" class="modal-input" placeholder="https://...mp3 (Leave empty for procedural synth)" />

          <label class="modal-label" for="customLrcText">Paste .LRC Lyrics</label>
          <textarea id="customLrcText" class="modal-textarea" rows="5" placeholder="[00:00.00] First lyric line..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btnSettingsCancel">Close</button>
        <button class="btn btn-primary" id="btnSettingsApply">Apply Track</button>
      </div>
    </div>
  </div>

  <!-- ================= RESULTS MODAL ================= -->
  <div class="modal-overlay" id="resultsModal" aria-hidden="true">
    <div class="modal-card glass-panel results-card">
      <div class="results-badge" id="resultsGradeBadge">RANK S</div>
      <h2 class="results-title">Song Complete</h2>
      <p class="results-subtitle" id="resultsTrackInfo">Midnight City // M83</p>

      <div class="results-grid">
        <div class="result-box">
          <span class="res-label">SPEED</span>
          <span class="res-val cyan-val" id="resWpm">74 WPM</span>
        </div>
        <div class="result-box">
          <span class="res-label">ACCURACY</span>
          <span class="res-val pink-val" id="resAcc">98%</span>
        </div>
        <div class="result-box">
          <span class="res-label">MAX COMBO</span>
          <span class="res-val yellow-val" id="resCombo">x4</span>
        </div>
        <div class="result-box">
          <span class="res-label">COMPLETED LINES</span>
          <span class="res-val mint-val" id="resLines">10 / 10</span>
        </div>
      </div>

      <div class="modal-footer results-footer">
        <button class="btn btn-primary" id="btnResultsRestart">Play Again</button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
